name: API and UI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # The suite shares one GitHub account; overlapping runs would fight over
  # rate limits and test data.
  group: gist-api-tests
  cancel-in-progress: false

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  api-tests:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
      GITHUB_TOKEN_2: ${{ secrets.GIST_TOKEN_2 }}
      GIST_RUN_ID: ${{ github.run_id }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v7

      - name: Check API credentials
        id: creds
        run: echo "have=${{ secrets.GIST_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        if: steps.creds.outputs.have == 'true'
        run: npx playwright test --project=api

      - name: Sweep leftover test data
        if: always() && steps.creds.outputs.have == 'true'
        run: npm run cleanup

      - name: Generate Allure report
        if: always() && steps.creds.outputs.have == 'true'
        run: npm run report:allure

      - name: Upload Allure report
        if: always() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  ui-tests:
    needs: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
      GIST_RUN_ID: ${{ github.run_id }}-${{ github.job }}
      GH_UI_USER: ${{ secrets.GH_UI_USER }}
      GH_UI_PASSWORD: ${{ secrets.GH_UI_PASSWORD }}
      GH_UI_TOTP_SECRET: ${{ secrets.GH_UI_TOTP_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check UI credentials
        id: creds
        run: echo "have=${{ secrets.GH_UI_USER != '' && secrets.GH_UI_PASSWORD != '' && secrets.GH_UI_TOTP_SECRET != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.creds.outputs.have == 'true'
        run: npm ci

      - name: Cache Playwright browsers
        if: steps.creds.outputs.have == 'true'
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.creds.outputs.have == 'true' && steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.creds.outputs.have == 'true' && steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run UI tests
        if: steps.creds.outputs.have == 'true'
        run: npx playwright test --project=ui

      - name: Sweep leftover test data
        if: always() && steps.creds.outputs.have == 'true'
        run: npm run cleanup

      - name: Generate Allure report
        if: always() && steps.creds.outputs.have == 'true'
        run: npm run report:allure

      - name: Upload Allure report
        if: always() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-ui
          path: allure-report/
          retention-days: 14

      - name: Upload Playwright HTML report
        if: always() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-ui
          path: playwright-report/
          retention-days: 14
